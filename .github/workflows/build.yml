name: build app

on:
  pull_request:
    paths-ignore:
      - '.devcontainer/**'
      - '.github/workflows/**'
      - 'docs/**'
      - '.idea/**'
      - '.vscode/**'
      - 'preview/**'
      - '.editorconfig'
      - '.gitignore'
      - 'LICENSE'
      - 'jitpack.yml'
      - '**/*.md'
      - 'renovate.json'
      - 'FUNDING.yml'
      - 'mkdocs.yaml'
      - 'pyproject.toml'
      - '.python-version'
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  JAVA_DISTRO: 'temurin'

jobs:
  build-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ app-activity, service-hilt, fullscreen-dialog, keyboard-usage ]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build ${{ matrix.module }} module
        run: |
          ./gradlew :samples:${{ matrix.module }}:assembleRelease --parallel
