name: build app

on:
  pull_request:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.pro'
      - 'gradle/**'
      - 'build-logic/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  push:
    branches:
      - master
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.pro'
      - 'gradle/**'
      - 'build-logic/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  JAVA_DISTRO: 'temurin'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"'

concurrency:
  group: ${{ github.ref }}-build
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ app-activity, service-hilt, fullscreen-dialog, keyboard-usage ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build ${{ matrix.module }} module
        run: |
          ./gradlew :samples:${{ matrix.module }}:assembleRelease --parallel
