name: Run Lint

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
      - '.github/**'
      - '!.github/workflows/**'
      - 'renovate.json'
      - '.devcontainer/**'
      - 'docs/**'
      - 'mkdocs.yaml'

env:
  JAVA_VERSION: 17
  JAVA_DISTRO: 'temurin'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Run Lint
        run: |
          git fetch origin master
          ./gradlew spotlessCheck
